name: E2E Tests

on:
  # Same trigger surface as ci.yml. Without the branch filter a topic branch
  # would spin up a kind cluster on every push, and once a PR is open the push
  # and pull_request events fire a second run each time — concurrency does not
  # collapse them, since the two carry different refs.
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '**/*.md'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-e2e:
    name: E2E Suite
    # Fork PRs run once the ok-to-test label is on them: added by hand, or by
    # /ok-to-test, whose GITHUB_TOKEN label starts no run and so counts from the
    # next push. Any other label is no reason to run: each one dependabot
    # attaches fired a run that cancelled the one before it.
    if: >
      (github.event.action != 'labeled' || github.event.label.name == 'ok-to-test') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository ||
       contains(github.event.pull_request.labels.*.name, 'ok-to-test'))
    # On the job, not the workflow: a run whose job the condition above skips
    # would still join a workflow-level group and cancel the run in progress.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build binary
        run: make build

      # Wrong-shell exports only fail when a real shell sources them.
      # A missing shell is skipped, not failed, so fish is best-effort.
      - name: Install the shells the hook is generated for
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          sudo apt-get install -y fish || echo "fish unavailable; the suite will skip it"

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create kind cluster
        run: make e2e-cluster

      - name: Run e2e suite
        run: make e2e

      - name: Delete kind cluster
        if: always()
        run: make e2e-cluster-clean
