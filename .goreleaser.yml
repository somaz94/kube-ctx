version: 2

# Set explicitly: the archive is named after the project, the binary inside it
# after the command, and those differ here (kube-ctx ships kctx).
project_name: kube-ctx

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/main.go
    binary: kctx
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/somaz94/kube-ctx/cmd/cli.Version={{.Version}}
      - -X github.com/somaz94/kube-ctx/cmd/cli.GitCommit={{.Commit}}
      - -X github.com/somaz94/kube-ctx/cmd/cli.BuildDate={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  groups:
    - title: "Features"
      regexp: '^feat'
      order: 0
    - title: "Bug Fixes"
      regexp: '^fix'
      order: 1
    - title: "Performance"
      regexp: '^perf'
      order: 2
    - title: "Refactoring"
      regexp: '^refactor'
      order: 3
    - title: "Build"
      regexp: '^build'
      order: 4
    - title: "Other Changes"
      order: 999
  filters:
    exclude:
      - '^docs: update changelog'
      - '^docs: update CONTRIBUTORS'
      - '^Merge'
      - '^Auto commit'

release:
  github:
    owner: somaz94
    name: kube-ctx
  draft: false
  prerelease: auto

# Homebrew. A cask rather than a formula: GoReleaser deprecated "brews" in
# v2.10 and documents removal in v2.16 — latest is already past that and only
# warns, which is not something to keep leaning on.
#
# Linux keeps working. Cask documentation is written for macOS and it is easy
# to conclude otherwise, but a cask whose only artifact is a binary installs
# fine on Linux: GoReleaser emits the on_linux URLs, and Homebrew's refusal is
# conditioned on the artifact not being installable, not on the platform.
# Verified by installing this cask from a tap under Homebrew 6.0.17 on
# linux/arm64 — it linked kctx and ran.
#
# Existing users are carried over by tap_migrations.json in the tap repo:
# Homebrew treats a formula and a cask of the same name as different things,
# so without it "brew upgrade" would simply stop finding this.
homebrew_casks:
  - name: kube-ctx
    binaries:
      - kctx
    directory: Casks
    repository:
      owner: somaz94
      name: homebrew-tap
    homepage: "https://github.com/somaz94/kube-ctx"
    description: "Switch Kubernetes contexts and namespaces, per-terminal and with production guards"
    hooks:
      post:
        # Homebrew quarantines cask downloads, and kctx is not signed or
        # notarized, so without this macOS refuses to run it. Signing needs a
        # paid Apple Developer account; until there is one, this is the trade.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kctx"]
          end
    caveats: |
      🎉 kctx installed!

      Quick start:
        kctx                       # Interactive context picker
        kctx ctx prod-eks          # Switch context
        kctx ns kube-system        # Switch namespace
        kctx doctor                # Check every cluster
        kctx --help                # Full usage

      For per-terminal context isolation, add to your rc file:
        eval "$(kctx init zsh)"    # bash: kctx init bash
                                   # fish: kctx init fish | source

      Docs: https://github.com/somaz94/kube-ctx

scoops:
  - repository:
      owner: somaz94
      name: scoop-bucket
    homepage: "https://github.com/somaz94/kube-ctx"
    description: "Switch Kubernetes contexts and namespaces, per-terminal and with production guards"
    license: "Apache-2.0"

# kubectl plugin, published to the personal index alongside diff2 and events2.
# "ctx" belongs to kubectx in the central index, hence the suffix.
#
# The caveats carry a limitation the other channels do not have: kubectl execs
# a plugin as a subprocess, so a switch made through "kubectl ctx2" cannot be
# shell-local and lands in the global kubeconfig instead. kube-ctx cannot even
# warn about it — kubectl leaves no marker in the environment or argv, and it
# execs rather than forks, so the parent process is the shell either way.
krews:
  - name: ctx2
    repository:
      owner: somaz94
      name: krew-index
    homepage: "https://github.com/somaz94/kube-ctx"
    description: "Switch Kubernetes contexts and namespaces, per-terminal and with production guards"
    short_description: "Per-terminal context switching with guards"
    caveats: |
      krew installs this as kubectl-ctx2.

      Read-only commands work as you would expect:
        kubectl ctx2 list
        kubectl ctx2 doctor
        kubectl ctx2 current

      Switching does not. "kubectl ctx2 ctx prod" runs the plugin as a
      subprocess of kubectl, which cannot change the shell that called it, so
      the switch lands in the global kubeconfig and every terminal follows it.

      For per-terminal isolation, install the hook and call the binary directly:

        eval "$(kubectl-ctx2 init zsh)"   # bash: kubectl-ctx2 init bash
                                          # fish: kubectl-ctx2 init fish | source
        kubectl-ctx2 ctx prod

      Docs: https://github.com/somaz94/kube-ctx
