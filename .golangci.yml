version: "2"

run:
  timeout: 5m
  allow-parallel-runners: true

# Defect-finding linters only. Style checks (goconst, dupl, lll, gocyclo, prealloc)
# are off on purpose: hundreds of non-bug findings would keep `make lint` red and ignored.
linters:
  default: none
  enable:
    - copyloopvar
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  exclusions:
    generated: lax
    rules:
      # Fixtures set up with os.WriteFile and friends discard errors by design;
      # a failure there fails the test on the next line anyway.
      - path: _test\.go
        linters:
          - errcheck
      # QF* checks are editor quickfix hints, not defects.
      - linters:
          - staticcheck
        text: "QF[0-9]+"
  settings:
    errcheck:
      # A failed write to stdout/stderr is not actionable: a broken pipe ends the
      # process. Note this exempts every Fprint* call, file writes included.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
    - goimports
