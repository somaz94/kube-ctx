# Synthetic kubeconfig for the README demo. Nothing here points at a real cluster.
apiVersion: v1
kind: Config
clusters:
  - name: dev
    cluster:
      server: https://dev.example.com:6443
  - name: staging
    cluster:
      server: https://staging.example.com:6443
  - name: prod
    cluster:
      server: https://prod.example.com:6443
users:
  - name: demo
    user: {}
contexts:
  - name: dev-kind
    context: {cluster: dev, user: demo, namespace: default}
  - name: staging-eks
    context: {cluster: staging, user: demo, namespace: web}
  - name: prod-eks
    context: {cluster: prod, user: demo, namespace: web}
  - name: prod-gke
    context: {cluster: prod, user: demo, namespace: web}
current-context: dev-kind
